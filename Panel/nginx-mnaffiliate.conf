# =====================================================================
# MN Affiliate Panel — Nginx Rules
# =====================================================================

# منطق:
#   - /mnaffiliate/api/webhook.php  -> تنها فایل PHP عمومی (تماس وردپرس)
#   - /mnaffiliate/index.php        -> روتر پنل (pretty URLs از اینجا رد می‌شوند)
#   - /mnaffiliate/assets/          -> فایل‌های استاتیک css/js
#   - بقیه فایل‌ها (config, templates, endpoints, functions.php و...)
#     مستقیماً قابل دسترسی نیستند (403)
# =====================================================================

location ^~ /mnaffiliate/ {
    location ^~ /mnaffiliate/config/ {
        deny all;
    }

    location ~* ^/mnaffiliate/(api/endpoints|templates|middleware|controllers)/ {
        deny all;
    }

    location ~* ^/mnaffiliate/(functions|list)\.php$ {
        deny all;
    }

    location ~* ^/mnaffiliate/[^/]+\.(sql|log|ini|sh|bak|old|md|txt)$ {
        deny all;
    }

    location = /mnaffiliate/api/webhook.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
        # !! این خط را با fastcgi_pass کانفیگ وردپرس خودتان یکی کنید:
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # نمونه‌های رایج دیگر:
        # fastcgi_pass unix:/run/php/php-fpm.sock;
        # fastcgi_pass 127.0.0.1:9000;
    }

    # --- پوشه آپلودها (رسیدهای پرداخت) -----------------------------------
    # فایل‌های استاتیک با نام تصادفی سرو می‌شوند؛ اجرای PHP مطلقاً ممنوع
    location ^~ /mnaffiliate/uploads/ {
        location ~* \.(php|phtml|phar)$ { deny all; }
        expires 1h;
        try_files $uri =404;
    }


   location = /mnaffiliate/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;  # !! مطابق بند 5
    }

    location ^~ /mnaffiliate/assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

     location / {
        try_files $uri /mnaffiliate/index.php;
    }
}

